<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdullah Telecom</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.header{
  background:#111827;
  color:white;
  padding:20px 15px;
  text-align:center;
}

.header h1{
  font-size:28px;
}

.header p{
  margin-top:7px;
  font-size:14px;
}

.menu{
  background:white;
  padding:12px;
  text-align:center;
  box-shadow:0 2px 8px #0002;
}

.menu a{
  color:#111;
  text-decoration:none;
  margin:0 8px;
  font-weight:bold;
  font-size:14px;
}

.banner{
  margin:15px;
  padding:25px 15px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  border-radius:18px;
  text-align:center;
}

.banner h2{
  font-size:24px;
  margin-bottom:8px;
}

.banner p{
  font-size:14px;
  margin-bottom:18px;
}

.banner button{
  background:white;
  color:#2563eb;
  border:0;
  padding:12px 22px;
  border-radius:25px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:10px 15px 30px;
}

.title{
  text-align:center;
  margin:20px 0;
  font-size:23px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.product{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 12px #0002;
  text-align:center;
  padding-bottom:15px;
}

.product .pic{
  height:145px;
  background:#eef2ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
}

.product h3{
  margin:12px 5px 5px;
}

.product p{
  color:#777;
  font-size:13px;
}

.product button{
  margin-top:12px;
  background:#2563eb;
  color:white;
  border:0;
  padding:10px 18px;
  border-radius:20px;
}

.order{
  background:white;
  padding:20px;
  border-radius:16px;
  box-shadow:0 3px 12px #0002;
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}

textarea{
  height:90px;
}

.orderBtn{
  width:100%;
  padding:14px;
  background:#16a34a;
  color:white;
  border:0;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
}

#whatsapp{
  display:none;
  margin-top:20px;
  background:#f0fdf4;
  padding:18px;
  border-radius:12px;
  text-align:center;
}

.wa{
  display:block;
  background:#16a34a;
  color:white;
  text-decoration:none;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  font-weight:bold;
}

.contact{
  text-align:center;
  background:white;
  padding:20px;
  border-radius:15px;
  margin-top:20px;
}

.footer{
  background:#111827;
  color:white;
  text-align:center;
  padding:25px 10px;
  margin-top:25px;
}
